<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>四时铃 · Pixel Isle</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1a1c2c;
      }
      #game {
        position: fixed;
        inset: 0;
      }
      #game canvas {
        display: block;
      }
      /* 加载时的小铃铛：用方块像素拼出来，左右摇摆 */
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        transition: opacity 0.35s;
        pointer-events: none;
      }
      #loader .bell {
        width: 6px;
        height: 6px;
        background: #a8682c;
        transform-origin: 3px -6px;
        animation: swing 0.9s ease-in-out infinite alternate;
        box-shadow:
          -6px 6px #ffc93c,
          0 6px #ffc93c,
          6px 6px #ffc93c,
          -12px 12px #ffc93c,
          -6px 12px #fff4d6,
          0 12px #ffc93c,
          6px 12px #ffc93c,
          12px 12px #e8a33a,
          -12px 18px #ffc93c,
          -6px 18px #ffc93c,
          0 18px #ffc93c,
          6px 18px #ffc93c,
          12px 18px #e8a33a,
          -18px 24px #e8a33a,
          -12px 24px #e8a33a,
          -6px 24px #e8a33a,
          0 24px #e8a33a,
          6px 24px #e8a33a,
          12px 24px #e8a33a,
          18px 24px #e8a33a,
          0 30px #7c4f35;
      }
      #loader .dots {
        display: flex;
        gap: 8px;
        margin-top: 24px;
      }
      #loader .dots i {
        width: 6px;
        height: 6px;
        background: #fff4d6;
        animation: blink 1.2s infinite;
      }
      #loader .dots i:nth-child(2) {
        animation-delay: 0.2s;
      }
      #loader .dots i:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes swing {
        from {
          transform: rotate(-16deg);
        }
        to {
          transform: rotate(16deg);
        }
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="loader">
      <div class="bell"></div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
